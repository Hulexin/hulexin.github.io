function presetThumbnail(p,i,template){const g=state.global,green=template===2;return `<button class="preset-tile" title="添加：${esc(p.name)}" onclick="${green?'insertGreenPage':'insertWarmPage'}(${i})"><div class="preset-sheet"><div class="poster ${green?'t2':'warm '+p.presetStyle}" style="--paper:${g.paper};--accent:${g.accent};--card:${g.card}">${headerMarkup(p,i)}<div class="blocks">${p.blocks.map(b=>'<section class="block">'+markup(b)+'</section>').join('')}</div>${footerMarkup(p,i)}</div></div><span class="preset-label">${String(i+1).padStart(2,'0')} · ${esc(p.name)}</span><span class="preset-add">＋ 添加页面</span></button>`}
function fitPresetThumbnails(){document.querySelectorAll('.preset-sheet').forEach(el=>{let art=el.querySelector('.poster');if(art)art.style.transform='scale('+el.clientWidth/1080+')';el.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'))})}

function headerMarkup(p,index){const g=state.global;const left=g.logoVisible===false?'':`<div class="brand-left">${g.logo?`<img src="${esc(g.logo)}" style="--logo-width:${Math.max(40,Math.min(650,Number(g.logoWidth)||250))}px">`:`${esc(g.brandCN)}<small>${esc(g.brandEN)}</small>`}</div>`;const right=g.headerIndexVisible===false?'':`<div class="header-index"><b>${String(index+1).padStart(2,'0')}</b><span>/</span><span>${esc(p.headerLabel||'ABOUT')}</span></div>`;return left||right?`<div class="brand">${left}${right}</div>`:''}
function footerMarkup(p,index){return `<div class="footer"><span>${esc(p.footerText??state.global.badge)}</span><span>${String(index+1).padStart(2,'0')} / ${String(state.pages.length).padStart(2,'0')}</span></div>`}
const panelBeforePageChrome=panel;panel=function(){panelBeforePageChrome();if(tab!=='global')return;const container=document.querySelector('#panel'),g=state.global,p=page();container.insertAdjacentHTML('beforeend',`<h4 style="margin-top:28px">页眉与页脚</h4><label><input type="checkbox" id="logoVisible" ${g.logoVisible!==false?'checked':''} style="width:auto"> 显示 Logo / 品牌名称</label><label>Logo 宽度（40–650 像素）</label><input type="range" min="40" max="650" value="${g.logoWidth||250}" id="logoWidth"><small id="logoWidthLabel">${g.logoWidth||250} px</small><label><input type="checkbox" id="headerIndexVisible" ${g.headerIndexVisible!==false?'checked':''} style="width:auto"> 显示页眉页码与栏目</label><label>当前页栏目文字</label><input id="pageHeaderLabel" value="${esc(p.headerLabel||'ABOUT')}" placeholder="ABOUT / SERVICES / CONTACT"><label>当前页页脚短句（留空可隐藏短句）</label><input id="pageFooterText" value="${esc(p.footerText??g.badge)}"><div class="hint">Logo 尺寸和显示开关应用到全部页面。栏目与页脚短句只修改当前页；未单独设置的页脚沿用上方全局页脚文字。</div>`);for(const key of ['logoVisible','headerIndexVisible'])document.querySelector('#'+key).onchange=e=>change(()=>state.global[key]=e.target.checked);const range=document.querySelector('#logoWidth');range.onpointerdown=()=>checkpoint();range.oninput=e=>{state.global.logoWidth=Number(e.target.value);document.querySelector('#logoWidthLabel').textContent=e.target.value+' px';save();renderCanvas()};range.onchange=()=>save();for(const [id,key] of [['pageHeaderLabel','headerLabel'],['pageFooterText','footerText']])document.querySelector('#'+id).onchange=e=>change(()=>page()[key]=e.target.value)};
const panelBeforeThumbnails=panel;panel=function(){panelBeforeThumbnails();fitPresetThumbnails()};

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea,[contenteditable]')){e.preventDefault();e.shiftKey?redo():undo()}});window.onresize=()=>{renderCanvas();fitPresetThumbnails()};render();
</script></html>
